<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://bvxfzcndquirqmpyhtpj.supabase.co wss://bvxfzcndquirqmpyhtpj.supabase.co; worker-src 'self' blob:">
  <title>ساحة النغالة • ساحة الرماد</title>
  <link rel="stylesheet" href="style.css?v=42">
  <script defer src="vendor/01-three.min.js"></script>
  <script defer src="vendor/02-GLTFLoader.js"></script>
  <script defer src="room-transport.js"></script>
  <script defer src="physics.js?v=42"></script>
  <script defer src="scene.js?v=42"></script>
  <script defer src="app.js?v=42"></script>
  <script defer src="rooms.js?v=42"></script>
</head>
<body>
  <canvas id="arena" aria-label="ساحة المبارزة"></canvas>
  <main id="lobby">
    <header><p class="series">ساحة الرماد</p><h1>ساحة<br> النغالة</h1></header>
    <section class="loadout" aria-label="اختيار سلاح">
      <button type="button" class="choice" id="open-weapons" disabled>
        <span class="weapon-copy"><small>السلاح المجهّز</small><strong id="gear-name">السيف المستقيم</strong></span>
        <img id="gear-preview" src="assets/sword.webp" alt=""><svg viewBox="0 0 24 24" width="18" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </section>
    <section class="actions" aria-label="بدء اللعب">
      <button type="button" class="primary" id="train" disabled>ابدأ المبارزة</button>
      <button type="button" id="melee" disabled>الملحمة</button>
      <button type="button" id="online" disabled>غرفة صديق</button>
    </section>
    <p id="load-status" role="status">جاري تحميل الحلبة…</p>
  </main>
  <dialog id="catalog" aria-labelledby="catalog-title">
    <header><h2 id="catalog-title">مخزن السلاح</h2><button type="button" class="close" aria-label="إغلاق">×</button></header>
    <nav id="filters" aria-label="نوع السلاح"></nav>
    <div id="cards"></div>
  </dialog>
  <dialog id="rooms" aria-labelledby="room-title">
    <header><h2 id="room-title">غرفة صديق</h2><button type="button" class="close" aria-label="إغلاق">×</button></header>
    <form id="room-form">
      <label for="room-code">رمز الغرفة</label>
      <input id="room-code" maxlength="12" placeholder="••••••••••••" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="room-actions"><button type="button" class="primary" id="host">افتح غرفة</button><button type="submit" id="join">انضم</button></div>
      <p id="room-status" role="status">شارك الرمز مع خصمك ليدخل معك.</p>
    </form>
  </dialog>
  <section id="fight" aria-label="أدوات المبارزة" hidden>
    <div class="score">
      <div id="me-score"><b>أنت</b><div class="bar"><i></i></div><div class="balance"><i></i></div></div>
      <output id="clock" aria-label="الوقت">1:40</output>
      <div id="rival-score"><b>الخصم</b><div class="bar"><i></i></div><div class="balance"><i></i></div></div>
    </div>
    <button type="button" id="exit" aria-label="خروج">×</button>
    <p id="combat-message" aria-live="polite"></p>
    <div class="controls" dir="ltr">
      <div class="pad" id="feet" aria-label="اسحب لتتحرك"><span class="pad-mark"></span><i></i><b>حركة</b></div>
      <div class="extras"><button type="button" id="guard">صدّ</button><button type="button" id="push">طعن</button></div>
      <div class="pad" id="blade" aria-label="اسحب لتوجّه السلاح"><span class="pad-mark"></span><i></i><b>نصل</b></div>
    </div>
    <div id="result" hidden><h2 id="verdict"></h2><div><button type="button" class="primary" id="retry">إعادة</button><button type="button" id="back">التجهيز</button></div></div>
  </section>
  <noscript>تحتاج إلى JavaScript لتشغيل ساحة النغالة.</noscript>
</body>
</html>
