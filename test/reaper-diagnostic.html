<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>تتبّع ضربة الحاصد</title><style>html,body{margin:0;height:100%;background:#0b0d18}iframe{border:0;width:100%;height:100dvh;display:block}#report{position:fixed;top:0;left:0;right:0;z-index:9999;background:#101820ed;color:#e6fff0;font:14px sans-serif;padding:8px;text-align:center;pointer-events:none}</style></head><body><iframe id="game" title="تجربة تشخيص الضربة" src="./releases/clean-20261117-v17/index.html"></iframe><div id="report" role="status">ابدأ جولة؛ سيظهر هنا مصدر أول ضربة نازلة</div><script>
const frame=document.getElementById('game'),report=document.getElementById('report');
frame.addEventListener('load',()=>{
  frame.contentWindow.reaperZoneReport=function(info){
    report.textContent='مصدر الضربة: '+info.source+' | البطل: '+info.hero+' | مهارات القصف: '+info.upgrades;
  };
  frame.contentWindow.eval(`(function(){
    const original=zone;
    zone=function(...args){
      const source=args[5] ? ({meteor:'بطاقة النيزك',star:'بطاقة مطر النجوم',sky:'بطاقة صاعقة السماء'}[args[6]] || 'قدرة صديقة: '+heroSpecial().n) : 'هجوم عدو';
      reaperZoneReport({source,hero:CHARS[S.char]?.n||S.char,upgrades:JSON.stringify({meteor:G.ups.meteor||0,starfall:G.ups.starfall||0,skystrike:G.ups.skystrike||0})});
      return original(...args);
    };
  })()`);
});
</script></body></html>
