name: Game checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      desktop:
        description: 'Also test desktop (mobile always runs)'
        type: boolean
        default: false

permissions:
  contents: read

# Cancel obsolete PR checks only. Separate non-PR runs must never cancel a deployment.
concurrency:
  group: game-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      fast: ${{ steps.fast.outcome }}
      mobile: ${{ steps.mobile.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Choose checks from changed files (unknown changes require mobile)
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/change-scope.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Fast rules, structure and packaging tests
        id: fast
        run: npm test
      - name: Analyze classic shared globals
        if: steps.scope.outputs.analyze == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run analyze
      - name: Cache verified CDN libraries and pinned Chromium
        if: steps.scope.outputs.browser == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tests/.cache/cdn/
            ~/.cache/ms-playwright/
          key: game-browser-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tests/fixtures/cdn-lock.json') }}
      - name: Prepare real CDN fixtures and Chromium
        if: steps.scope.outputs.browser == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm run test:fixtures
          npx playwright install --with-deps chromium
      - name: Real mobile touch smoke (desktop optional; production stays offline)
        id: mobile
        if: steps.scope.outputs.browser == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ALSO_DESKTOP: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop }}
        run: |
          if [ "$ALSO_DESKTOP" = "true" ]; then npm run test:all; else npm run test:smoke; fi
      - name: Package tested game only
        run: npm run package:game
      - name: Upload preview reports
        if: always() && (steps.scope.outputs.browser == 'true' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload tested Pages artifact (same checkout/SHA)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/game

  # Legacy Pages keeps publishing main on every push. This probe lets deploy
  # activate itself as soon as Settings → Pages → Source becomes GitHub Actions.
  pages:
    name: pages
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: read
    outputs:
      actions: ${{ steps.probe.outputs.actions }}
    steps:
      - name: Detect Pages source
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo legacy)
          if [ "$type" = "workflow" ]; then echo "actions=true" >> "$GITHUB_OUTPUT"; else echo "actions=false" >> "$GITHUB_OUTPUT"; fi
          echo "Pages build_type: $type"

  deploy:
    name: deploy
    needs: [check, pages]
    if: needs.pages.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration (never auto-enable Pages)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the artifact produced by check in this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  handoff:
    name: Update handoff on main
    needs: [check, pages, deploy]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 6
      - name: Avoid replacing a newer main handoff
        id: freshness
        run: |
          handoff_remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$handoff_remote_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Newer main exists; its run owns the handoff.'
          fi
      - name: Record actual revision, changed files and check outcomes
        if: steps.freshness.outputs.current == 'true'
        env:
          HANDOFF_BEFORE: ${{ github.event.before }}
          HANDOFF_CHECK: ${{ needs.check.result }}
          HANDOFF_FAST: ${{ needs.check.outputs.fast }}
          HANDOFF_MOBILE: ${{ needs.check.outputs.mobile }}
          HANDOFF_PROFILE: ${{ needs.check.outputs.profile }}
          HANDOFF_DEPLOY: ${{ needs.deploy.result }}
        run: node tools/update-handoff.mjs
      - name: Save only the handoff (GITHUB_TOKEN pushes do not trigger another run)
        if: steps.freshness.outputs.current == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: تحديث آلي لملف التسليم'
          if ! git push origin HEAD:refs/heads/main; then
            handoff_remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$handoff_remote_sha" != "$GITHUB_SHA" ]; then
              echo 'Main advanced during the update; keep the newer run.'
              exit 0
            fi
            exit 1
          fi
