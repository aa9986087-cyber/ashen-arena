name: Game checks and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete PR checks only. Separate non-PR runs must never cancel a deployment.
concurrency:
  group: game-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Fast rules, structure and packaging tests
        run: npm test
      - name: Analyze classic shared globals
        run: npm run analyze
      - name: Cache verified CDN libraries and pinned Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            tests/.cache/cdn/
            ~/.cache/ms-playwright/
          key: game-browser-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tests/fixtures/cdn-lock.json') }}
      - name: Prepare real CDN fixtures and Chromium
        run: |
          npm run test:fixtures
          npx playwright install --with-deps chromium
      - name: Real desktop and mobile smoke (offline production boundary)
        run: npm run test:smoke
      - name: Package tested game only
        run: npm run package:game
      - name: Upload preview reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: check-reports-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload tested Pages artifact (same checkout/SHA)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/game

  # Legacy Pages keeps publishing main on every push. This probe lets deploy
  # activate itself as soon as Settings → Pages → Source becomes GitHub Actions.
  pages:
    name: pages
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: read
    outputs:
      actions: ${{ steps.probe.outputs.actions }}
    steps:
      - name: Detect Pages source
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo legacy)
          if [ "$type" = "workflow" ]; then echo "actions=true" >> "$GITHUB_OUTPUT"; else echo "actions=false" >> "$GITHUB_OUTPUT"; fi
          echo "Pages build_type: $type"

  deploy:
    name: deploy
    needs: [check, pages]
    if: needs.pages.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration (never auto-enable Pages)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the artifact produced by check in this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
